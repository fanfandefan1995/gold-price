<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>实时金价</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card-border: #2a2a4a;
  --text: #e8e8f0;
  --text-dim: #8888aa;
  --gold: #ffd700;
  --green: #00c853;
  --red: #ff5252;
  --accent: #7c4dff;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 12px;
  -webkit-tap-highlight-color: transparent;
}
.header {
  text-align: center;
  padding: 16px 0 8px;
}
.header h1 {
  font-size: 1.4em;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 2px;
}
.header .subtitle {
  font-size: 0.8em;
  color: var(--text-dim);
  margin-top: 4px;
}
.status-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin: 8px 0 16px;
  font-size: 0.75em;
  color: var(--text-dim);
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
.status-dot.error { background: var(--red); animation: none; }
.status-dot.loading { background: var(--accent); animation: pulse 0.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Main Price Card */
.price-main {
  background: linear-gradient(135deg, #1e1e3a 0%, #2a1a3a 100%);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.price-main::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,215,0,0.03) 0%, transparent 60%);
}
.price-main .label {
  font-size: 0.85em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.price-main .value {
  font-size: 3em;
  font-weight: 700;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.price-main .unit {
  font-size: 0.85em;
  color: var(--text-dim);
  margin-top: 4px;
}
.price-main .change {
  margin-top: 12px;
  font-size: 1.1em;
  font-weight: 600;
}
.change.up { color: var(--green); }
.change.down { color: var(--red); }

/* Dual Price Grid */
.price-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.price-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 16px 12px;
  text-align: center;
}
.price-card .card-label {
  font-size: 0.75em;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.price-card .card-value {
  font-size: 1.5em;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.price-card .card-change {
  font-size: 0.8em;
  margin-top: 4px;
}

/* Cost Comparison */
.cost-section {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.cost-section h3 {
  font-size: 0.85em;
  color: var(--text-dim);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.cost-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.cost-row:last-child { border-bottom: none; }
.cost-row .cost-label { font-size: 0.85em; color: var(--text-dim); }
.cost-row .cost-value { font-size: 1em; font-weight: 600; }
.cost-input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cost-input {
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1em;
  padding: 6px 10px;
  width: 80px;
  text-align: right;
}
.cost-input:focus { outline: none; border-color: var(--gold); }

/* Mini Chart */
.chart-section {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.chart-section h3 {
  font-size: 0.85em;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.chart-container {
  width: 100%;
  height: 120px;
  position: relative;
}
canvas#sparkline {
  width: 100%;
  height: 100%;
}

/* Other Metals */
.metals-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.metal-item {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 12px 8px;
  text-align: center;
}
.metal-item .m-name { font-size: 0.7em; color: var(--text-dim); }
.metal-item .m-price { font-size: 1.1em; font-weight: 600; margin-top: 4px; }
.metal-item .m-unit { font-size: 0.62em; color: var(--text-dim); margin-top: 2px; }

/* Refresh Button */
.refresh-btn {
  display: block;
  width: 100%;
  padding: 14px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  font-size: 0.9em;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 12px;
}
.refresh-btn:active { transform: scale(0.97); background: rgba(255,215,0,0.1); }
.refresh-btn.spinning { opacity: 0.6; }

/* Footer */
.footer {
  text-align: center;
  font-size: 0.7em;
  color: var(--text-dim);
  padding: 16px 0;
}
.footer a { color: var(--accent); text-decoration: none; }

/* Settings Panel */
.settings-toggle {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--card-border);
  color: var(--text-dim);
  font-size: 1.2em;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.panel {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  padding: 60px 20px 20px;
}
.panel.show { display: block; }
.panel-content {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  max-width: 400px;
  margin: 0 auto;
}
.panel-content h3 { margin-bottom: 16px; color: var(--gold); }
.panel-content label { display: block; font-size: 0.85em; color: var(--text-dim); margin-bottom: 4px; }
.panel-content input[type="number"],
.panel-content select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
  font-size: 1em;
  margin-bottom: 14px;
}
.panel-close {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: white;
  font-size: 1em;
  cursor: pointer;
  margin-top: 8px;
}
.source-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7em;
  background: rgba(124,77,255,0.2);
  color: var(--accent);
}
</style>
</head>
<body>

<div class="header">
  <h1>REAL-TIME GOLD</h1>
  <div class="subtitle">实时黄金价格监控</div>
</div>

<div class="status-bar">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">连接中...</span>
  <span id="refreshTimer"></span>
</div>

<!-- Main CNY Price -->
<div class="price-main">
  <div class="label">国内金价（元/克）</div>
  <div class="value" id="cnyPrice">--</div>
  <div class="unit">CNY / g · 上海金交所参考</div>
  <div class="change" id="cnyChange">--</div>
</div>

<!-- Dual Grid: USD + Exchange -->
<div class="price-grid">
  <div class="price-card">
    <div class="card-label">国际金价</div>
    <div class="card-value" id="usdPrice">--</div>
    <div class="card-change" id="usdChange">--</div>
    <div style="font-size:0.7em;color:var(--text-dim);margin-top:2px;">USD/盎司</div>
  </div>
  <div class="price-card">
    <div class="card-label">美元汇率</div>
    <div class="card-value" id="fxRate">--</div>
    <div class="card-change" id="fxChange">--</div>
    <div style="font-size:0.7em;color:var(--text-dim);margin-top:2px;">USD/CNY</div>
  </div>
</div>

<!-- Cost Comparison -->
<div class="cost-section">
  <h3>💰 我的持仓对比</h3>
  <div class="cost-row">
    <span class="cost-label">我的买入价</span>
    <div class="cost-input-wrap">
      <input type="number" class="cost-input" id="myCost" value="765" step="1">
      <span style="font-size:0.8em;color:var(--text-dim)">元/克</span>
    </div>
  </div>
  <div class="cost-row">
    <span class="cost-label">当前盈亏</span>
    <span class="cost-value" id="profitInfo">--</span>
  </div>
  <div class="cost-row">
    <span class="cost-label">距成本</span>
    <span class="cost-value" id="costDiff">--</span>
  </div>
  <div class="cost-row">
    <span class="cost-label">年内最高</span>
    <span class="cost-value" style="color:var(--gold)">1256 元/克</span>
  </div>
  <div class="cost-row">
    <span class="cost-label">全球开采成本</span>
    <span class="cost-value" style="color:var(--text-dim)">~447 元/克</span>
  </div>
</div>

<!-- Price History Chart -->
<div class="chart-section">
  <h3>📈 当日走势（自动记录）</h3>
  <div class="chart-container">
    <canvas id="sparkline"></canvas>
  </div>
</div>

<!-- Other Metals -->
<div class="metals-grid">
  <div class="metal-item">
    <div class="m-name">白银</div>
    <div class="m-price" id="silverPrice">--</div>
    <div class="m-unit">元/克</div>
  </div>
  <div class="metal-item">
    <div class="m-name">铂金</div>
    <div class="m-price" id="platinumPrice">--</div>
    <div class="m-unit">元/克</div>
  </div>
  <div class="metal-item">
    <div class="m-name">钯金</div>
    <div class="m-price" id="palladiumPrice">--</div>
    <div class="m-unit">元/克</div>
  </div>
</div>

<!-- Refresh -->
<button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">↻ 手动刷新</button>

<div class="footer">
  数据来源：<span class="source-badge" id="sourceBadge">连接中</span><br>
  仅供参考，不构成投资建议<br>
  <span id="lastUpdate"></span>
</div>

<!-- Settings -->
<div class="settings-toggle" onclick="openSettings()">⚙</div>
<div class="panel" id="settingsPanel">
  <div class="panel-content">
    <h3>设置</h3>
    <label>买入成本（元/克）</label>
    <input type="number" id="setCost" value="765" step="1">
    <label>刷新间隔</label>
    <select id="setInterval">
      <option value="15000">15 秒</option>
      <option value="30000" selected>30 秒</option>
      <option value="60000">1 分钟</option>
      <option value="120000">2 分钟</option>
      <option value="300000">5 分钟</option>
    </select>
    <label>数据源优先级</label>
    <select id="setSource">
      <option value="auto" selected>自动（三个源依次尝试）</option>
      <option value="goldprice">仅 goldprice.org</option>
      <option value="计算">仅汇率换算备用源</option>
    </select>
    <button class="panel-close" onclick="saveSettings()">保存</button>
  </div>
</div>

<script>
// ===== State =====
let state = {
  refreshInterval: 30000,
  myCost: 765,
  countdown: 30,
  priceHistory: [],
  timer: null,
  countdownTimer: null,
  source: 'auto'
};

// Load saved settings
try {
  const saved = localStorage.getItem('goldToolSettings');
  if (saved) Object.assign(state, JSON.parse(saved));
} catch(e) {}

// ===== Price History (localStorage 按天持久化) =====
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function loadPriceHistory() {
  try {
    const raw = localStorage.getItem('goldPriceHistory');
    if (!raw) return [];
    const obj = JSON.parse(raw);
    if (obj.date !== todayKey()) return []; // 跨天重置
    return obj.items.map(it => ({ time: new Date(it.t), price: it.p, usd: it.u }));
  } catch(e) { return []; }
}
function savePriceHistory() {
  try {
    const items = state.priceHistory.slice(-2000).map(d => ({ t: d.time.getTime(), p: d.price, u: d.usd }));
    localStorage.setItem('goldPriceHistory', JSON.stringify({ date: todayKey(), items }));
  } catch(e) {}
}
state.priceHistory = loadPriceHistory();

// ===== API Sources =====
// Source 1: goldprice.org (direct international+CNY)
async function fetchFromGoldPriceOrg() {
  const resp = await fetch('https://data-asg.goldprice.org/dbXRates/USD,CNY', {
    signal: AbortSignal.timeout(6000),
    headers: { 'Accept': 'application/json' }
  });
  if (!resp.ok) throw new Error('goldprice.org HTTP ' + resp.status);
  const data = await resp.json();
  if (!data?.item?.length) throw new Error('goldprice.org no data');
  const usd = data.item.find(i => i.currency === 'USD');
  const cny = data.item.find(i => i.currency === 'CNY');
  return {
    usdPerOz: usd?.xau || 0,
    cnyPerG: cny?.xau || 0,
    usdChange: usd?.chg_xau || 0,
    cnyChange: cny?.chg_xau || 0,
    usdChangeAbs: usd?.chgAbs_xau || 0,
    cnyChangeAbs: cny?.chgAbs_xau || 0,
    silver: usd?.xag || 0,
    platinum: usd?.xpt || 0,
    palladium: usd?.xpd || 0,
    ts: data.ts,
    source: 'goldprice.org'
  };
}

// Source 2: gold-api.com (XAU + 其他贵金属)
async function fetchFromGoldApi() {
  const j = u => fetch(u, { signal: AbortSignal.timeout(8000) }).then(r => r.json()).catch(() => ({}));
  const [xau, xag, xpt, xpd, fx] = await Promise.all([
    j('https://api.gold-api.com/price/XAU'),
    j('https://api.gold-api.com/price/XAG'),
    j('https://api.gold-api.com/price/XPT'),
    j('https://api.gold-api.com/price/XPD'),
    j('https://open.er-api.com/v6/latest/USD')
  ]);
  const usdPerOz = xau?.price || 0;
  if (!usdPerOz) throw new Error('gold-api no price');
  const usdCny = fx?.rates?.CNY || 7.25;
  const cnyPerG = (usdPerOz * usdCny) / 31.1035;
  return {
    usdPerOz,
    cnyPerG,
    usdChange: 0, cnyChange: 0, usdChangeAbs: 0, cnyChangeAbs: 0,
    silver: xag?.price || 0,
    platinum: xpt?.price || 0,
    palladium: xpd?.price || 0,
    ts: Date.now(),
    source: 'gold-api + er-api'
  };
}

// Source 3: er-api + gold-api 贵金属
async function fetchFromExchange() {
  const j = u => fetch(u, { signal: AbortSignal.timeout(8000) }).then(r => r.json()).catch(() => ({}));
  const [fx, xag, xpt, xpd] = await Promise.all([
    j('https://open.er-api.com/v6/latest/XAU'),
    j('https://api.gold-api.com/price/XAG'),
    j('https://api.gold-api.com/price/XPT'),
    j('https://api.gold-api.com/price/XPD')
  ]);
  if (fx?.result !== 'success' && !fx?.rates) throw new Error('er-api failed');
  const usdPerOz = fx?.rates?.USD || 0;
  const cnyPerOz = fx?.rates?.CNY || 0;
  const cnyPerG = cnyPerOz / 31.1035;
  if (!usdPerOz && !cnyPerG) throw new Error('er-api no gold data');
  return {
    usdPerOz,
    cnyPerG,
    usdChange: 0, cnyChange: 0, usdChangeAbs: 0, cnyChangeAbs: 0,
    silver: xag?.price || 0,
    platinum: xpt?.price || 0,
    palladium: xpd?.price || 0,
    ts: Date.now(),
    source: 'er-api(XAU)'
  };
}

async function fetchGoldPrice() {
  setStatus('loading', '获取数据中...');
  let result = null;

  if (state.source === 'goldprice') {
    // 仅 goldprice（含涨跌幅，但国内可能超时）
    try { result = await fetchFromGoldPriceOrg(); } catch (e) { console.warn(e.message); }
  } else if (state.source === '计算') {
    // 仅 gold-api
    try { result = await fetchFromGoldApi(); } catch (e) { console.warn(e.message); }
  } else {
    // auto：gold-api 为主（CORS稳、含贵金属），并行用 goldprice 补充涨跌幅
    const [apiRes, gpRes] = await Promise.allSettled([
      fetchFromGoldApi(),
      fetchFromGoldPriceOrg()
    ]);
    result = apiRes.status === 'fulfilled' ? apiRes.value
           : (gpRes.status === 'fulfilled' ? gpRes.value : null);
    // gold-api 成功但缺涨跌幅时，用 goldprice 的涨跌幅补充
    if (result && apiRes.status === 'fulfilled' && gpRes.status === 'fulfilled') {
      const g = gpRes.value;
      result.usdChange = g.usdChange; result.usdChangeAbs = g.usdChangeAbs;
      result.cnyChange = g.cnyChange; result.cnyChangeAbs = g.cnyChangeAbs;
      result.source = 'gold-api + goldprice';
    }
  }

  if (!result || (!result.usdPerOz && !result.cnyPerG)) {
    setStatus('error', '数据获取失败，请检查网络');
    return;
  }

  updateUI(result);
  setStatus('ok', `已更新 · ${result.source}`);

  // Record price for chart (persist per-day)
  if (result.cnyPerG > 0) {
    state.priceHistory.push({ time: new Date(), price: result.cnyPerG, usd: result.usdPerOz });
    if (state.priceHistory.length > 2000) state.priceHistory.shift();
    savePriceHistory();
  }
  drawChart();

  // 日内涨跌兑底：无外部涨跌幅时，用当天首点作今开
  if (!result.cnyChange && !result.usdChange && state.priceHistory.length >= 2) {
    renderIntradayChange();
  }
}

// ===== UI Update =====
function updateUI(data) {
  // Main CNY price
  document.getElementById('cnyPrice').textContent = data.cnyPerG > 0 
    ? data.cnyPerG.toFixed(1) : '--';
  
  const cnyChgEl = document.getElementById('cnyChange');
  if (data.cnyChange !== 0) {
    const sign = data.cnyChange >= 0 ? '+' : '';
    cnyChgEl.textContent = `${sign}${data.cnyChangeAbs.toFixed(2)} (${sign}${data.cnyChange.toFixed(2)}%)`;
    cnyChgEl.className = 'change ' + (data.cnyChange >= 0 ? 'up' : 'down');
  }
  
  // USD price
  document.getElementById('usdPrice').textContent = data.usdPerOz > 0 
    ? '$' + data.usdPerOz.toFixed(1) : '--';
  
  const usdChgEl = document.getElementById('usdChange');
  if (data.usdChange !== 0) {
    const sign = data.usdChange >= 0 ? '+' : '';
    usdChgEl.textContent = `${sign}${data.usdChangeAbs.toFixed(1)} (${sign}${data.usdChange.toFixed(2)}%)`;
    usdChgEl.className = 'card-change ' + (data.usdChange >= 0 ? 'up' : 'down');
  }
  
  // Exchange rate (implied)
  let impliedFx = 0;
  if (data.usdPerOz > 0 && data.cnyPerG > 0) {
    impliedFx = (data.cnyPerG * 31.1035) / data.usdPerOz;
    document.getElementById('fxRate').textContent = impliedFx.toFixed(4);
  }

  // Other metals: 美元/盎司 → 人民币元/克（与黄金同口径换算）
  const toCnyPerG = usd => (usd > 0 && impliedFx > 0)
    ? (usd * impliedFx / 31.1035).toFixed(2) : '--';
  document.getElementById('silverPrice').textContent = toCnyPerG(data.silver);
  document.getElementById('platinumPrice').textContent = toCnyPerG(data.platinum);
  document.getElementById('palladiumPrice').textContent = toCnyPerG(data.palladium);
  
  // Cost comparison
  updateCostDisplay(data.cnyPerG);
  
  // Source badge
  document.getElementById('sourceBadge').textContent = data.source;
  
  // Last update time
  const now = new Date();
  document.getElementById('lastUpdate').textContent = 
    `最后更新: ${now.toLocaleTimeString('zh-CN')} | 刷新间隔: ${state.refreshInterval/1000}秒`;
}

function updateCostDisplay(currentPrice) {
  if (!currentPrice) return;
  const cost = parseFloat(document.getElementById('myCost').value) || state.myCost;
  const diff = currentPrice - cost;
  const pct = (diff / cost * 100);
  
  const profitEl = document.getElementById('profitInfo');
  const diffEl = document.getElementById('costDiff');
  
  const sign = diff >= 0 ? '+' : '';
  profitEl.textContent = `${sign}${diff.toFixed(1)} 元/克 (${sign}${pct.toFixed(2)}%)`;
  profitEl.style.color = diff >= 0 ? 'var(--green)' : 'var(--red)';
  
  if (diff < 0) {
    diffEl.textContent = `还需涨 ${Math.abs(diff).toFixed(1)} 元回本`;
    diffEl.style.color = 'var(--red)';
  } else {
    diffEl.textContent = `已盈利 ${diff.toFixed(1)} 元/克`;
    diffEl.style.color = 'var(--green)';
  }
}

function setStatus(type, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + (type === 'ok' ? '' : type);
  document.getElementById('statusText').textContent = text;
}

// 日内涨跌（相对当天第一个采集点）
function renderIntradayChange() {
  const first = state.priceHistory[0];
  const cur = state.priceHistory[state.priceHistory.length - 1];
  if (!first || !cur || !first.price || !cur.price) return;
  // 国内 CNY
  const cnyDiff = cur.price - first.price;
  const cnyPct = cnyDiff / first.price * 100;
  const cnyEl = document.getElementById('cnyChange');
  const s1 = cnyDiff >= 0 ? '+' : '';
  cnyEl.textContent = `${s1}${cnyDiff.toFixed(2)} (${s1}${cnyPct.toFixed(2)}%) 日内`;
  cnyEl.className = 'change ' + (cnyDiff >= 0 ? 'up' : 'down');
  // 国际 USD（需 history 存了 usd）
  if (first.usd && cur.usd) {
    const usdDiff = cur.usd - first.usd;
    const usdPct = usdDiff / first.usd * 100;
    const usdEl = document.getElementById('usdChange');
    const s2 = usdDiff >= 0 ? '+' : '';
    usdEl.textContent = `${s2}${usdDiff.toFixed(1)} (${s2}${usdPct.toFixed(2)}%) 日内`;
    usdEl.className = 'card-change ' + (usdDiff >= 0 ? 'up' : 'down');
  }
}

// ===== Chart =====
function drawChart() {
  const canvas = document.getElementById('sparkline');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  const data = state.priceHistory;
  if (data.length < 2) {
    ctx.fillStyle = '#8888aa';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('数据采集中，当日走势会自动累积保存（关掉重开不丢）', w/2, h/2);
    return;
  }

  const prices = data.map(d => d.price);
  const times = data.map(d => d.time.getTime());
  const min = Math.min(...prices), max = Math.max(...prices);
  const pad = (max - min) * 0.1 || 1;
  const lo = min - pad, hi = max + pad, range = hi - lo || 1;
  const t0 = times[0], t1 = times[times.length - 1], tSpan = (t1 - t0) || 1;

  const padTop = 16, padBottom = 22, padLeft = 8, padRight = 8;
  const chartH = h - padTop - padBottom, chartW = w - padLeft - padRight;
  const X = t => padLeft + ((t - t0) / tSpan) * chartW;
  const Y = p => padTop + chartH - ((p - lo) / range) * chartH;

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = padTop + chartH * (i / 4);
    ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(w - padRight, y); ctx.stroke();
  }

  // Line
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, 'rgba(255,215,0,0.3)');
  gradient.addColorStop(1, 'rgba(255,215,0,0)');
  ctx.beginPath();
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  for (let i = 0; i < data.length; i++) {
    const x = X(times[i]), y = Y(prices[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Fill area
  ctx.lineTo(X(t1), h - padBottom);
  ctx.lineTo(X(t0), h - padBottom);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  // Latest point
  ctx.beginPath();
  ctx.arc(X(t1), Y(prices[prices.length - 1]), 4, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd700';
  ctx.fill();

  // Labels: 高/低 + 时间范围
  ctx.fillStyle = '#8888aa';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('高 ' + max.toFixed(1), padLeft, padTop + 9);
  ctx.fillText('低 ' + min.toFixed(1), padLeft, h - padBottom - 2);
  const fmt = ts => new Date(ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  ctx.textAlign = 'right';
  ctx.fillText(fmt(t0) + ' → ' + fmt(t1), w - padRight, h - 4);
  ctx.textAlign = 'center';
  ctx.fillText('点数 ' + data.length, w / 2, h - 4);
}

// ===== Timers =====
function startAutoRefresh() {
  clearInterval(state.timer);
  clearInterval(state.countdownTimer);
  
  state.countdown = Math.floor(state.refreshInterval / 1000);
  
  state.timer = setInterval(fetchGoldPrice, state.refreshInterval);
  state.countdownTimer = setInterval(() => {
    state.countdown--;
    document.getElementById('refreshTimer').textContent = 
      state.countdown > 0 ? `(${state.countdown}s)` : '';
    if (state.countdown <= 0) state.countdown = Math.floor(state.refreshInterval / 1000);
  }, 1000);
}

function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.textContent = '↻ 刷新中...';
  fetchGoldPrice().finally(() => {
    setTimeout(() => {
      btn.classList.remove('spinning');
      btn.textContent = '↻ 手动刷新';
    }, 500);
  });
  state.countdown = Math.floor(state.refreshInterval / 1000);
}

// ===== Settings =====
function openSettings() {
  document.getElementById('setCost').value = state.myCost;
  document.getElementById('setInterval').value = state.refreshInterval;
  document.getElementById('setSource').value = state.source;
  document.getElementById('settingsPanel').classList.add('show');
}

function saveSettings() {
  state.myCost = parseFloat(document.getElementById('setCost').value) || 765;
  state.refreshInterval = parseInt(document.getElementById('setInterval').value) || 30000;
  state.source = document.getElementById('setSource').value;
  
  document.getElementById('myCost').value = state.myCost;
  
  try { localStorage.setItem('goldToolSettings', JSON.stringify(state)); } catch(e) {}
  
  document.getElementById('settingsPanel').classList.remove('show');
  startAutoRefresh();
  fetchGoldPrice();
}

// Close panel on background click
document.getElementById('settingsPanel').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});

// Cost input live update
document.getElementById('myCost').addEventListener('input', function() {
  state.myCost = parseFloat(this.value) || 765;
  const cnyPrice = parseFloat(document.getElementById('cnyPrice').textContent);
  if (cnyPrice > 0) updateCostDisplay(cnyPrice);
  try { localStorage.setItem('goldToolSettings', JSON.stringify(state)); } catch(e) {}
});

// ===== Visibility API: pause when hidden =====
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(state.timer);
    clearInterval(state.countdownTimer);
  } else {
    fetchGoldPrice();
    startAutoRefresh();
  }
});

// ===== Init =====
drawChart();
fetchGoldPrice();
startAutoRefresh();

// Register Service Worker (for PWA install)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
